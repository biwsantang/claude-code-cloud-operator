name: Verify Claude runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
    - 'images/runtime/**'
    - 'hack/runtime-*'
    - 'hack/npm-security-smoke.cjs'
    - '.github/workflows/runtime.yml'
    - '.dockerignore'
  push:
    branches: [main]
    paths:
    - 'images/runtime/**'
    - 'hack/runtime-*'
    - 'hack/npm-security-smoke.cjs'
    - '.github/workflows/runtime.yml'
    - '.dockerignore'
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    # Private, disposable build only: no registry login, image upload, vendor credential or publication.
    - name: Build maintained-base runtime
      id: build
      run: docker build --platform linux/amd64 -f images/runtime/Dockerfile -t claude-cloud-runtime:ci .
    - name: Restricted runtime and development-tool smoke
      run: sh hack/runtime-smoke.sh claude-cloud-runtime:ci linux/amd64
    - name: Credential-boundary and npm regression probes
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: sh hack/runtime-smoke.sh claude-cloud-runtime:ci linux/amd64 security
    - name: Retain SBOM and enforce runtime Critical threshold
      id: scan
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: python3 hack/runtime-scan.py --image claude-cloud-runtime:ci --output "$RUNNER_TEMP/runtime-scan"
    # Private review metadata only; no binaries, image layers or vendor credentials are uploaded.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() && !cancelled() && steps.scan.outcome != 'skipped' }}
      with:
        name: runtime-amd64-inventory
        path: ${{ runner.temp }}/runtime-scan/*.json
        retention-days: 7
        if-no-files-found: error
