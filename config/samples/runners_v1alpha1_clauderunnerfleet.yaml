apiVersion: runners.biwsantang.github.io/v1alpha1
kind: ClaudeRunnerFleet
metadata:
  labels:
    app.kubernetes.io/name: claude-code-cloud-operator
    app.kubernetes.io/managed-by: kustomize
  name: example
  namespace: cloud-operator-system
spec:
  suspended: true
  environmentID: ccpool_REPLACE_ME
  environmentSecretRef:
    name: example-environment
  networkReportRef:
    name: example-network-report
  # Replace all three example digests with verified images before activation.
  orchestratorImage: example.invalid/runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  hookImage: example.invalid/hook@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  execution:
    runnerImage: example.invalid/runtime@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    securityRevision: replace-after-network-acceptance
    proxy:
      url: http://proxy.proxy.svc:3128
      namespace: proxy
      podLabels:
        app: proxy
      port: 3128
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 4Gi
    workspaceSize: 8Gi
