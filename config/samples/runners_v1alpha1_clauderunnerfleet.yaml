# User-owned environment; installation supplies runtime, helper and network defaults.
# Apply after configuring operator defaults. Suspended defaults to true.
apiVersion: runners.biwsantang.github.io/v1alpha1
kind: ClaudeRunnerFleet
metadata:
  name: example
  namespace: cloud-operator-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  environmentID: ccpool_REPLACE_ME
  environmentSecretRef:
    name: example-environment
