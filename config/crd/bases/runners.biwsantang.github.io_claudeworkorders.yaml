---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: claudeworkorders.runners.biwsantang.github.io
spec:
  group: runners.biwsantang.github.io
  names:
    kind: ClaudeWorkOrder
    listKind: ClaudeWorkOrderList
    plural: claudeworkorders
    singular: claudeworkorder
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.launchAttempted
      name: Fenced
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              clockOffsetSeconds:
                default: 0
                description: |-
                  ClockOffsetSeconds is local minus vendor time measured from the native poll's HTTP Date.
                  It corrects the signed expiry into the synchronized cluster clock domain; redelivery cannot change it.
                format: int64
                maximum: 3600
                minimum: -3600
                type: integer
              complete:
                type: boolean
              credentialSecretRef:
                description: LocalReference cannot name resources outside the Fleet
                  namespace.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace exists only to explicitly reject cross-namespace
                      input.
                    maxLength: 0
                    type: string
                required:
                - name
                type: object
              execution:
                description: |-
                  ExecutionPolicy is deliberately narrower than PodSpec. Fleets may omit installation defaults.
                  WorkOrders require the complete resolved policy and must never inherit defaults. All accepted inputs are frozen in a receipt.
                properties:
                  clockMarginSeconds:
                    default: 300
                    format: int64
                    maximum: 3600
                    minimum: 60
                    type: integer
                  diagnosticRetentionSeconds:
                    default: 3600
                    format: int64
                    maximum: 604800
                    minimum: 300
                    type: integer
                  hostConfigRef:
                    description: LocalReference cannot name resources outside the
                      Fleet namespace.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace exists only to explicitly reject cross-namespace
                          input.
                        maxLength: 0
                        type: string
                    required:
                    - name
                    type: object
                  lifecycle:
                    description: Lifecycle is resolved and frozen only for newly accepted
                      orders. Missing on a legacy receipt preserves legacy behavior.
                    properties:
                      idleMinutes:
                        description: 'IdleMinutes releases idle sessions using the
                          native runner. New-order default: 30; 0 disables.'
                        format: int32
                        maximum: 10080
                        minimum: 0
                        type: integer
                      maxSessionMinutes:
                        description: 'MaxSessionMinutes starts native release at the
                          age threshold, followed by native grace. Default: 480; 0
                          disables.'
                        format: int32
                        maximum: 10080
                        minimum: 0
                        type: integer
                      promptToSave:
                        description: 'PromptToSave installs a once-per-turn reminder,
                          never an unconditional git commit/push. New-order default:
                          true.'
                        type: boolean
                      pushOutcomeOnRelease:
                        description: 'PushOutcomeOnRelease opts into native best-effort
                          push of committed outcome refs. Restrict claude/* push access
                          first. Default: false.'
                        type: boolean
                      shutdownWaitSeconds:
                        description: 'ShutdownWaitSeconds lets an in-flight turn finish
                          after SIGTERM. New-order default: 300; 0 skips the wait.'
                        format: int32
                        maximum: 86400
                        minimum: 0
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: Positive idleMinutes cannot exceed maxSessionMinutes
                      rule: '!has(self.idleMinutes) || !has(self.maxSessionMinutes)
                        || self.idleMinutes == 0 || self.maxSessionMinutes == 0 ||
                        self.idleMinutes <= self.maxSessionMinutes'
                  maxTokenLifetimeSeconds:
                    default: 86400
                    format: int64
                    maximum: 604800
                    minimum: 60
                    type: integer
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  proxy:
                    properties:
                      namespace:
                        minLength: 1
                        type: string
                      podLabels:
                        additionalProperties:
                          type: string
                        minProperties: 1
                        type: object
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      url:
                        pattern: ^http://[a-z0-9.-]+:[0-9]+$
                        type: string
                    required:
                    - namespace
                    - podLabels
                    - port
                    - url
                    type: object
                  resources:
                    description: ResourceRequirements describes the compute resource
                      requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  runnerImage:
                    pattern: ^[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}$
                    type: string
                  securityRevision:
                    minLength: 1
                    type: string
                  sessionConfigImage:
                    description: |-
                      SessionConfigImage is stamped from the Fleet hook image at intake; do not set it on Fleets.
                      It pins the materializer/save helper for the accepted order, independently of later hook upgrades.
                    pattern: ^[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}$
                    type: string
                  tolerations:
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                  workspaceSize:
                    default: 8Gi
                    type: string
                type: object
                x-kubernetes-validations:
                - message: Receipts require complete resolved execution configuration
                  rule: has(self.runnerImage) && has(self.securityRevision) && has(self.proxy)
                    && has(self.resources)
              expiresAt:
                format: date-time
                type: string
              fleetName:
                maxLength: 63
                minLength: 1
                type: string
              fleetUID:
                maxLength: 128
                minLength: 1
                type: string
              orderID:
                maxLength: 256
                minLength: 1
                type: string
              policyDigest:
                pattern: ^[a-f0-9]{64}$
                type: string
              poolID:
                maxLength: 256
                minLength: 1
                type: string
              tokenDigest:
                pattern: ^[a-f0-9]{64}$
                type: string
            required:
            - clockOffsetSeconds
            - complete
            - credentialSecretRef
            - execution
            - expiresAt
            - fleetName
            - fleetUID
            - orderID
            - policyDigest
            - poolID
            - tokenDigest
            type: object
            x-kubernetes-validations:
            - message: Receipt identity and accepted policy are immutable
              rule: self.fleetName == oldSelf.fleetName && self.fleetUID == oldSelf.fleetUID
                && self.poolID == oldSelf.poolID && self.orderID == oldSelf.orderID
                && self.tokenDigest == oldSelf.tokenDigest && self.expiresAt == oldSelf.expiresAt
                && self.clockOffsetSeconds == oldSelf.clockOffsetSeconds && self.credentialSecretRef
                == oldSelf.credentialSecretRef && self.policyDigest == oldSelf.policyDigest
            - message: Complete receipts cannot be reopened
              rule: '!oldSelf.complete || self.complete'
          status:
            properties:
              accepted:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                format: date-time
                type: string
              launchAttempted:
                description: LaunchAttempted is a monotonic fence, persisted before
                  the sole Pod POST.
                type: boolean
              launchAttemptedAt:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              podName:
                type: string
              podObserved:
                type: boolean
              podUID:
                type: string
              reason:
                type: string
              retainUntil:
                format: date-time
                type: string
              submissionUncertain:
                type: boolean
              terminal:
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
