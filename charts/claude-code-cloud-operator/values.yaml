# Source chart: provide verified manager and hook digests. Release packaging supplies both.
managerImage: ""
hookImage: ""

# Configure a qualified Claude runtime once. Fleets inherit it; a Fleet may override
# execution.runnerImage for its repository toolchain. No public runtime is bundled yet.
runtime:
  image: ""
  orchestratorImage: ""

# Existing enforced egress proxy, shared by all Fleets. This chart does not deploy a proxy.
# Select a Service in its namespace; complete all four fields together.
network:
  securityRevision: installation-v1
  proxy: {}
