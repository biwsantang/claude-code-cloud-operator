apiVersion: runners.biwsantang.github.io/v1alpha1
kind: ClaudeRunnerFleet
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "20"
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: claude-code-cloud-operator
    app.kubernetes.io/managed-by: Helm
  name: {{ .Values.fleet.name | quote }}
