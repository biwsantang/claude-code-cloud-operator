  networkReportRef:
    name: {{ .Values.fleet.networkReportRef | quote }}
  # Replace all three example digests with verified images before activation.
  orchestratorImage: {{ .Values.fleet.runtimeImage | quote }}
  hookImage: {{ .Values.fleet.hookImage | quote }}
  orchestratorReplicas: {{ .Values.fleet.orchestratorReplicas }}
  execution:
    runnerImage: {{ .Values.fleet.runtimeImage | quote }}
    securityRevision: {{ .Values.fleet.securityRevision | quote }}
    proxy:
      url: {{ .Values.fleet.proxy.url | quote }}
      namespace: {{ .Values.fleet.proxy.namespace | quote }}
      podLabels: {{ toYaml .Values.fleet.proxy.podLabels | nindent 8 }}
      port: {{ .Values.fleet.proxy.port }}
    resources: {{ toYaml .Values.fleet.resources | nindent 6 }}
    workspaceSize: {{ .Values.fleet.workspaceSize | quote }}
    lifecycle: {{ toYaml .Values.fleet.session | nindent 6 }}
